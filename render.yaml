services:
  - type: web
    name: lumine-backend
    env: python
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumine-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://lumineai.vercel.app"
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: lumine-db
    databaseName: lumine
    user: lumine_user
